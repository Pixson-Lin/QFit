<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QFit User Guide</title>
  <meta name="description" content="QFit step simulator user guide. No sign-in; on-device permissions only." />
  <link rel="stylesheet" href="assets/guide.css" />
  <script>
    (function () {
      var langs = (navigator.languages && navigator.languages.length)
        ? navigator.languages
        : [navigator.language || "en"];
      var hant = langs.some(function (l) {
        var s = String(l || "").toLowerCase();
        return s === "zh-tw" || s === "zh-hk" || s === "zh-mo" ||
          s.indexOf("zh-hant") === 0 || s === "zh-hant";
      });
      location.replace(hant ? "zh/" : "en/");
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=en/" />
  </noscript>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">QFit</div>
      <h1>User Guide</h1>
      <p class="tagline">No sign-in. On-device permissions only. Nothing uploaded to the developer.</p>
      <p class="lede">Choose a language (JavaScript redirect also runs automatically):</p>
    </header>
    <p><a href="en/">English</a> · <a href="zh/">繁體中文</a></p>
    <footer>
      <p>QFit · Author Pixson Lin</p>
    </footer>
  </div>
</body>
</html>
